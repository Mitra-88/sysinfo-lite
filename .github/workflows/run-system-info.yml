name: Run System Info on All OS

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  run-script:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04, ubuntu-26.04-arm, windows-2022, windows-2025, macos-26, macos-26-intel]
        python-version: ["3.10", "3.12", "3.14"]
        exclude:
          # macOS 26 images ship Python 3.11+ only; asking for 3.10 there
          # pulls the x64 toolchain build that aborts on ARM (dyld:
          # libintl.8.dylib not found).
          - os: macos-26
            python-version: "3.10"
          - os: macos-26-intel
            python-version: "3.10"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python -m unittest discover -v

      - name: Run system info script
        run: python system_info.py
