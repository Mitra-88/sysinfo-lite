name: Run System Info on All OS

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  run-script:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
        exclude:
          # setup-python's x64 Python 3.10 build aborts on ARM macOS
          # runners (dyld: Library not loaded ... libintl.8.dylib).
          - os: macos-latest
            python-version: "3.10"
        include:
          - os: macos-latest
            python-version: "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python -m unittest discover -v

      - name: Run system info script
        run: python system_info.py
